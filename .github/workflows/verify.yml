name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Clean generated files
        run: npm run clean
      - name: Format files
        run: npm run format
      - name: Check formatting made no changes
        run: git diff --exit-code
      - name: Build game
        run: npm run build
